<style>
  @font-face { font-family: Bravura; src: url(fonts/Bravura.woff) format("woff"); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, sans-serif; background: #2f7d32;
         -webkit-tap-highlight-color: transparent; overflow: hidden; }
  .ekran { position: fixed; inset: 0; display: none; flex-direction: column;
           max-width: 480px; margin: 0 auto; }
  .ekran.acik { display: flex; }

  /* ---- HARİTA ---- */
  #ust { display: flex; justify-content: space-between; align-items: center;
         padding: 8px 10px; background: #1f5e25; color: #fff; z-index: 5; gap: 6px; }
  .hap { background: rgba(0,0,0,.28); border-radius: 20px; padding: 6px 12px;
         font-weight: 700; font-size: 16px; white-space: nowrap; }
  #baslik { font-weight: 800; letter-spacing: .5px; font-size: 14px; }
  #ayar, #bilgi { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; padding: 0 2px; }
  #serit { display: flex; justify-content: space-between; gap: 8px; background: #174a1c; color: #ffe9a8;
           font-size: 13px; font-weight: 700; padding: 6px 12px; }
  #harita { flex: 1; overflow-y: auto; position: relative;
            background: linear-gradient(#7ed957, #4cae3f 60%, #3e9a37); }
  #yol { position: relative; }
  #yol svg { position: absolute; left: 0; top: 0; pointer-events: none; }
  .suslu { position: absolute; font-size: 34px; pointer-events: none; user-select: none; }
  .dugum { position: absolute; border-radius: 50%; display: flex; align-items: center;
           justify-content: center; font-weight: 800; color: #fff; font-size: 22px;
           border: 4px solid; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25);
           user-select: none; }
  .dugum.kilit { background: #6b8cae; border-color: #4a6a8a; font-size: 20px; }
  .dugum.simdi { background: #ff7a1a; border-color: #d85a00; animation: zipla 1s infinite; }
  .dugum.bitti { background: #46c35f; border-color: #2c9a43; }
  .dugum.boss { box-shadow: 0 0 0 4px #ffd54a, 0 5px 0 rgba(0,0,0,.25); }
  .dugum .tac { position: absolute; top: -18px; font-size: 18px; }
  .yildizlar { position: absolute; font-size: 14px; text-align: center; width: 70px;
               pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .tabela { position: absolute; background: #3b2f2f; color: #ffe9a8; border: 3px solid #d9c27c;
            border-radius: 10px; font-size: 11px; font-weight: 800; text-align: center;
            padding: 4px 8px; line-height: 1.2; pointer-events: none; }
  @keyframes zipla { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  #menu { display: flex; gap: 6px; padding: 8px; background: #1f5e25; }
  .menubtn { flex: 1; padding: 10px 2px; font-size: 14px; font-weight: 700; border: 0; border-radius: 10px;
             background: #ffd54a; color: #3b2f2f; cursor: pointer; box-shadow: 0 3px 0 #c9a300; }
  #imza { background: #1f5e25; color: #d6ecd0; text-align: center; font-size: 12px;
          padding: 4px 10px 8px; line-height: 1.4; }
  #imza b { color: #fff; }
    #kur { background: #ffd54a; color: #3b2f2f; border: 0; border-radius: 20px; padding: 6px 10px;
         font-weight: 800; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .adim { text-align: left; margin: 8px 0; padding: 8px 10px; background: #f1f7ee; border-radius: 8px; font-size: 15px; }
  @media (max-width: 400px) { #baslik { display: none; } }


  /* ---- OYUN ---- */
  #ekranOyun { background: #f6fbf2; }
  #oyunUst { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
             background: #1f5e25; color: #fff; }
  #cik { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
  #ilerleme { flex: 1; height: 12px; background: rgba(0,0,0,.3); border-radius: 8px; overflow: hidden; }
  #ilerlemeDolgu { height: 100%; width: 0; background: #ffd54a; transition: width .3s; }
  #kalpler { font-size: 18px; letter-spacing: 2px; white-space: nowrap; }
  #jokerler { display: none; gap: 6px; padding: 8px 10px; background: #e3f2dc; align-items: stretch; }
  #jokerler .cuzdan { flex: 0 0 62px; display: flex; flex-direction: column; justify-content: center;
                      text-align: center; font-weight: 800; font-size: 15px; color: #7a5a00; line-height: 1.2; }
  #jokerler .cuzdan small { font-size: 10px; color: #666; font-weight: 600; }
  .jk { flex: 1; padding: 6px 2px; font-size: 12px; font-weight: 700; border: 2px solid #7bbf6a;
        border-radius: 10px; background: #fff; cursor: pointer; line-height: 1.25; touch-action: manipulation; }
  .jk:disabled { opacity: .38; cursor: default; }
  #oyunGovde { flex: 1; overflow-y: auto; padding: 14px; }
  #nota { border: 1px solid #ddd; border-radius: 10px; width: 100%; max-width: 320px;
          margin: 0 auto 14px; background: #fff; }
  #nota svg { display: block; width: 100%; height: auto; }
  #soruad { border: 1px solid #ddd; border-radius: 10px; width: 100%; max-width: 420px;
            margin: 0 auto 14px; padding: 1rem; font-size: 1.6rem; font-weight: 700;
            background: #fff; text-align: center; }
  #ipucu { display: none; max-width: 420px; margin: 0 auto 12px; padding: 10px 12px; border-radius: 10px;
           background: #fff8d6; border: 2px dashed #e0b400; font-size: 15px; text-align: center; }
  #siklar { margin: 0 auto; }
  #siklar.adlar { max-width: 420px; }
  #siklar.adlar .sik { display: block; width: 100%; min-height: 54px; margin: .5rem 0;
                       padding: .6rem; font-size: 17px; }
  #siklar.portler { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 480px; }
  #siklar.portler .sik { padding: 4px; margin: 0; background: #fff; }
  #siklar.portler .sik svg { display: block; width: 100%; height: auto; pointer-events: none; }
  .sik { border: 2px solid #bbb; border-radius: 10px; background: #fff;
         cursor: pointer; touch-action: manipulation; font-family: inherit; }
  .sik:disabled { opacity: 1; cursor: default; }
  .sik.elendi { opacity: .2 !important; }
  .sik.dogru { background: #c6f6d5; border-color: #38a169; }
  .sik.yanlis { background: #fed7d7; border-color: #e53e3e; }
  #sonuc { text-align: center; margin-top: 12px; font-size: 18px; min-height: 1.5em; font-weight: 600; }

  /* ---- MODAL ---- */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
           align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  #modal.acik { display: flex; }
  #kutu { background: #fff; border-radius: 18px; padding: 22px 18px; width: 100%;
          max-width: 360px; text-align: center; max-height: 90vh; overflow-y: auto; }
  #kutu.genis { max-width: 440px; }
  #kutu h2 { margin: 0 0 8px; }
  #kutu p { margin: 6px 0; color: #444; }
  .buyukyildiz { font-size: 38px; margin: 8px 0; letter-spacing: 4px; }
  .dugme { display: block; width: 100%; padding: 13px; margin-top: 10px; border: 0;
           border-radius: 12px; font-size: 17px; font-weight: 700; cursor: pointer;
           background: #46c35f; color: #fff; box-shadow: 0 4px 0 #2c9a43; }
  .dugme.gri { background: #e2e8f0; color: #333; box-shadow: 0 4px 0 #b6c0cc; }
  .dugme:disabled { opacity: .45; }
  .kartlar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .kart { border-radius: 10px; padding: 14px 4px; font-size: 13px; font-weight: 700; background: #e2e8f0;
          color: #94a3b8; min-height: 54px; display: flex; align-items: center; justify-content: center; }
  .kart.ac { background: #fff3c4; color: #5c4500; border: 2px solid #e0b400; cursor: pointer; }
  #kartNota { border: 1px solid #ddd; border-radius: 10px; background: #fff; margin: 8px auto; max-width: 300px; }
  #kartNota svg { display: block; width: 100%; height: auto; }
  .zsatir { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 8px;
            background: #fff0f0; margin: 4px 0; font-weight: 600; font-size: 15px; text-align: left; }
  #hata { position: fixed; top: 0; left: 0; right: 0; color: #fff; background: #b00;
          font-weight: bold; white-space: pre-wrap; z-index: 99; }
  #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
           background: #222; color: #fff; padding: 10px 18px; border-radius: 20px; max-width: 90%;
           font-size: 14px; display: none; z-index: 30; text-align: center; }

</style>

<script>
  function hataYaz(m) { var h = document.getElementById('hata'); if (h) h.textContent = m; }
  window.addEventListener('error', function (e) { hataYaz('HATA: ' + e.message + ' (satır ' + e.lineno + ')'); });
</script>

<!-- HARİTA -->
<div id="ekranHarita" class="ekran acik">
  <div id="ust">
    <div class="hap" id="yildizSayi">⭐ 0</div>
    <div id="baslik">PERDE MACERASI</div>
        <button id="kur" style="display:none">📲 Yükle</button>
    <button id="ayar" title="İlerlemeyi sıfırla">⚙️</button>

    <button id="bilgi" title="Hakkında">ℹ️</button>
  </div>
  <div id="serit"><span id="unvan"></span><span id="seri"></span></div>
  <div id="harita"><div id="yol"></div></div>
  <div id="menu">
    <button class="menubtn" id="kartBtn">🃏 Kartlar</button>
    <button class="menubtn" id="zayifBtn">🎯 Zayıf</button>
    <button class="menubtn" id="gunBtn">📅 Günlük<span id="gunNokta"></span></button>
  </div>
  <div id="imza">Geliştiren: <b>Burak Baştaş</b> · OMÜ Türk Sanat Müziği</div>
</div>

<!-- OYUN -->
<div id="ekranOyun" class="ekran">
  <div id="oyunUst">
    <button id="cik">✕</button>
    <div id="ilerleme"><div id="ilerlemeDolgu"></div></div>
    <div id="kalpler"></div>
  </div>
  <div id="jokerler"></div>
  <div id="oyunGovde">
    <div id="soruad" style="display:none"></div>
    <div id="nota" style="display:none"></div>
    <div id="ipucu"></div>
    <div id="siklar"></div>
    <div id="sonuc"></div>
  </div>
</div>

<div id="modal"><div id="kutu"></div></div>
<div id="toast"></div>

<script>
// =====================================================
// 1) VERİ
// Yazım: Nota + işaret (+ diyez, - bemol) + tür (k koma, bk bakiye, km küçük mücenneb, bm büyük mücenneb)
// İki yazım "/" ile ayrılır, ikisi birlikte çizilir.
// =====================================================
const VERI = [
  ['Kaba Çargâh',     'Do'],
  ['Kaba Nim Hicaz',  'Do+bk / Re-km'],
  ['Kaba Hicaz',      'Do+km / Re-bk'],
  ['Kaba Dik Hicaz',  'Do+bm / Re-k'],
  ['Yegâh',           'Re'],
  ['Kaba Nim Hisar',  'Re+bk / Mi-km'],
  ['Kaba Hisar',      'Re+km / Mi-bk'],
  ['Kaba Dik Hisar',  'Re+bm / Mi-k'],
  ['Hüseyni Aşiran',  'Mi'],
  ['Acem Aşiran',     'Fa'],
  ['Dik Acem Aşiran', 'Fa+k / Sol-bm'],
  ['Irak',            'Fa+bk / Sol-km'],
  ['Geveşt',          'Fa+km / Sol-bk'],
  ['Dik Geveşt',      'Fa+bm / Sol-k'],
  ['Rast',            'Sol'],
  ['Nim Zirgüle',     'Sol+bk / La-km'],
  ['Zirgüle',         'Sol+km / La-bk'],
  ['Dik Zirgüle',     'Sol+bm / La-k'],
  ['Dügâh',           'La'],
  ['Kürdi',           'La+bk / Si-km'],
  ['Dik Kürdi',       'La+km / Si-bk'],
  ['Segâh',           'La+bm / Si-k'],
  ['Bûselik',         'Si'],
  ['Dik Bûselik',     'Do-k'],
  ['Çargâh',          'Do'],
  ['Nim Hicaz',       'Do+bk / Re-km'],
  ['Hicaz',           'Do+km / Re-bk'],
  ['Dik Hicaz',       'Do+bm / Re-k'],
  ['Neva',            'Re'],
  ['Nim Hisar',       'Re+bk / Mi-km'],
  ['Hisar',           'Re+km / Mi-bk'],
  ['Dik Hisar',       'Re+bm / Mi-k'],
  ['Hüseyni',         'Mi'],
  ['Acem',            'Fa'],
  ['Dik Acem',        'Fa+k / Sol-bm'],
  ['Evç',             'Fa+bk / Sol-km'],
  ['Mahur',           'Fa+km / Sol-bk'],
  ['Dik Mahur',       'Fa+bm / Sol-k'],
  ['Gerdâniye',       'Sol'],
  ['Nim Şehnaz',      'Sol+bk / La-km'],
  ['Şehnaz',          'Sol+km / La-bk'],
  ['Dik Şehnaz',      'Sol+bm / La-k'],
  ['Muhayyer',        'La'],
  ['Sünbüle',         'La+bk / Si-km'],
  ['Dik Sünbüle',     'La+km / Si-bk'],
  ['Tiz Segâh',       'La+bm / Si-k'],
  ['Tiz Bûselik',     'Si'],
  ['Tiz Çargâh',      'Do']
];

const DEGISTIRGE = {
  '+k':  0xE444, '-k':  0xE443,
  '+bk': 0xE445, '-bk': 0xE442,
  '+km': 0xE446, '-km': 0xE441,
  '+bm': 0xE447, '-bm': 0xE440
};
const SOL_ANAHTARI = 0xE050;
const NOTA_BASI    = 0xE0A4;

const HARF_SIRASI = { do: 0, re: 1, mi: 2, fa: 3, sol: 4, la: 5, si: 6 };
const HARF_AD     = { do: 'Do', re: 'Re', mi: 'Mi', fa: 'Fa', sol: 'Sol', la: 'La', si: 'Si' };
const KOMA_TABAN  = { do: 0, re: 9, mi: 18, fa: 22, sol: 31, la: 40, si: 49 };
const KOMA_DEGER  = { k: 1, bk: 4, km: 5, bm: 8 };
const TUR_AD      = { k: 'koma', bk: 'bakiye', km: 'küçük mücenneb', bm: 'büyük mücenneb' };

// =====================================================
// 2) VERİYİ OKU
// =====================================================
function notaOku(metin) {
  const m = /^(Do|Re|Mi|Fa|Sol|La|Si)(?:([+-])(k|bk|km|bm))?$/.exec(metin.trim());
  if (!m) throw new Error('Okunamayan yazım: "' + metin + '"');
  return { harf: m[1].toLowerCase(), isaret: m[2] || null, tur: m[3] || null };
}
function mutlakKoma(p) {
  let d = 0;
  if (p.isaret) d = (p.isaret === '+' ? 1 : -1) * KOMA_DEGER[p.tur];
  return p.oktav * 53 + KOMA_TABAN[p.harf] + d;
}

// Gruplar: 0 ana perdeler, 1 diğer tam notalar, 2 tek kelimeli komalı,
// 3 Nim/Dik ara perdeler, 4 Kaba/Tiz/Aşiran komalı perdeler
const ANA = ['Rast','Dügâh','Bûselik','Çargâh','Neva','Hüseyni','Acem','Gerdâniye','Muhayyer'];
function grupBul(ad, parcalar) {
  if (ANA.indexOf(ad) >= 0) return 0;
  if (parcalar.length === 1 && !parcalar[0].isaret) return 1;
  if (ad.split(' ').length === 1) return 2;
  if (/^(Nim|Dik) /.test(ad) && ad.indexOf('Aşiran') < 0) return 3;
  return 4;
}
const GRUP_AD = [
  'Ana perdeler',
  'Diğer tam notalar',
  'Tek kelimeli komalı perdeler',
  'Nim ve Dik ara perdeler',
  'Kaba, Tiz ve Aşiran perdeleri'
];

const PERDELER = [];
let oktav = 4, oncekiIlk = -1, oncekiKoma = null;

VERI.forEach(function (satir, i) {
  const ad = satir[0];
  const parcalar = satir[1].split('/').map(notaOku);
  const ilkIdx = HARF_SIRASI[parcalar[0].harf];
  if (i > 0 && ilkIdx < oncekiIlk) oktav++;
  oncekiIlk = ilkIdx;
  parcalar.forEach(function (p) {
    p.oktav = oktav + (HARF_SIRASI[p.harf] < ilkIdx ? 1 : 0);
    p.koma = mutlakKoma(p);
  });
  if (parcalar.length === 2 && parcalar[0].koma !== parcalar[1].koma) console.warn(ad + ': iki yazım tutmuyor');
  if (oncekiKoma !== null && parcalar[0].koma <= oncekiKoma) console.warn(ad + ': sıra bozuk');
  oncekiKoma = parcalar[0].koma;
  PERDELER.push({ id: 'p' + i, ad: ad, parcalar: parcalar, grup: grupBul(ad, parcalar) });
});

// Örnek: "Fa4 bakiye diyez = Sol4 küçük mücenneb bemol"
function notaMetni(perde) {
  return perde.parcalar.map(function (p) {
    let s = HARF_AD[p.harf] + p.oktav;
    if (p.isaret) s += ' ' + TUR_AD[p.tur] + ' ' + (p.isaret === '+' ? 'diyez' : 'bemol');
    return s;
  }).join(' = ');
}

// =====================================================
// 3) SEVİYELER, ÜNVANLAR, KAPILAR, JOKERLER
// =====================================================
const BOLUMLER = [
  { g: [0],             n: 2, yeni: 0 },
  { g: [0,1],           n: 2, yeni: 1 },
  { g: [0,1,2],         n: 5, yeni: 2 },
  { g: [0,1,2,3],       n: 6, yeni: 3 },
  { g: [0,1,2,3,4],     n: 6, yeni: 4 },
  { g: [0,1,2,3,4],     n: 5, yeni: null }
];
const YONLER = ['portead', 'adporte', 'karisik'];
const SEVIYELER = [];
BOLUMLER.forEach(function (b, bi) {
  for (let j = 0; j < b.n; j++) {
    const boss = j === b.n - 1;
    SEVIYELER.push({
      no: SEVIYELER.length + 1,
      bolum: bi,
      gruplar: b.g,
      yeni: b.yeni,
      boss: boss,
      yon: boss ? 'karisik' : YONLER[j % 3],
      soru: boss ? 12 : (bi === BOLUMLER.length - 1 ? 10 : 8),
      yeniOran: boss ? 0.45 : 0.6
    });
  }
});

const UNVANLAR = [
  { min: 0,  ad: 'Çırak' },
  { min: 3,  ad: 'Talebe' },
  { min: 6,  ad: 'Hanende' },
  { min: 10, ad: 'Sazende' },
  { min: 15, ad: 'Mahir' },
  { min: 21, ad: 'Üstat' },
  { min: 26, ad: 'Üstad-ı Kâmil' }
];
function unvanOf(n) {
  let u = UNVANLAR[0];
  UNVANLAR.forEach(function (x) { if (n >= x.min) u = x; });
  return u;
}

const GECIT_ORAN = 0.45;   // Bölüm kapısı: önceki bölümlerdeki maksimum yıldızın %45'i
function kapiGereken(bolum) {
  let onceki = 0;
  SEVIYELER.forEach(function (s) { if (s.bolum < bolum) onceki++; });
  return Math.round(onceki * 3 * GECIT_ORAN);
}

const JOKERLER = [
  { id: 'yarim', ikon: '✂️', ad: '%50',    maliyet: 2 },
  { id: 'ipucu', ikon: '💡', ad: 'İpucu',  maliyet: 1 },
  { id: 'atla',  ikon: '⏭️', ad: 'Atla',   maliyet: 2 },
  { id: 'kalp',  ikon: '❤️', ad: '+Kalp',  maliyet: 3 }
];
const JOKER_LIMIT = 3;

// =====================================================
// 4) KAYIT
// =====================================================
const ANAHTAR = 'perdeMacerasiV1';
function varsayilan() {
  return { yildiz: [], bonus: 0, harcanan: 0, zayif: {}, kart: {},
           seri: { son: '', sayi: 0 }, gunluk: { tarih: '' } };
}
let DURUM = varsayilan();
try {
  const k = JSON.parse(localStorage.getItem(ANAHTAR));
  if (k && Array.isArray(k.yildiz)) DURUM = Object.assign(varsayilan(), k);
} catch (e) {}
function kaydet() { try { localStorage.setItem(ANAHTAR, JSON.stringify(DURUM)); } catch (e) {} }

function yildizOf(i) { return DURUM.yildiz[i] || 0; }
function toplamYildiz() { return DURUM.yildiz.reduce(function (a, b) { return a + (b || 0); }, 0) + DURUM.bonus; }
function cuzdan() { return toplamYildiz() - DURUM.harcanan; }
function bitenSayi() { let n = 0; SEVIYELER.forEach(function (s, i) { if (yildizOf(i) > 0) n++; }); return n; }
function suAnki() { for (let i = 0; i < SEVIYELER.length; i++) if (yildizOf(i) === 0) return i; return SEVIYELER.length - 1; }
function acikMi(i) {
  if (i === 0) return true;
  if (yildizOf(i - 1) === 0) return false;
  if (SEVIYELER[i - 1].bolum !== SEVIYELER[i].bolum) return toplamYildiz() >= kapiGereken(SEVIYELER[i].bolum);
  return true;
}

// ---- Gün ve seri ----
function gunAnahtar(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function bugun() { return gunAnahtar(new Date()); }
function dun() { const d = new Date(); d.setDate(d.getDate() - 1); return gunAnahtar(d); }
function seriGun() { const s = DURUM.seri; return (s.son === bugun() || s.son === dun()) ? s.sayi : 0; }
function seriGuncelle() {
  const s = DURUM.seri, b = bugun();
  if (s.son === b) return;
  s.sayi = (s.son === dun()) ? s.sayi + 1 : 1;
  s.son = b;
  let m = '🔥 ' + s.sayi + '. gün serisi!';
  if (s.sayi % 7 === 0) { DURUM.bonus++; m += ' +1 ⭐'; }
  kaydet();
  toast(m, 3200);
}

// ---- Rastgelelik (günlük soru için tohumlu) ----
let RAST = Math.random;
function tohumla(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function karistir(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.floor(RAST() * (i + 1));
    const t = b[i]; b[i] = b[j]; b[j] = t;
  }
  return b;
}
function rastgele(a) { return a[Math.floor(RAST() * a.length)]; }

// =====================================================
// 5) NOTA ÇİZİMİ
// =====================================================
const ALT_CIZGI_Y = 90;
function notaCiz(kutu, perde) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 220 140');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  function cizgi(x1, x2, y) {
    const l = document.createElementNS(ns, 'line');
    l.setAttribute('x1', x1); l.setAttribute('x2', x2);
    l.setAttribute('y1', y);  l.setAttribute('y2', y);
    l.setAttribute('stroke', '#333');
    svg.appendChild(l);
  }
  function glif(kod, x, y, boyut) {
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y);
    t.setAttribute('font-family', 'Bravura');
    t.setAttribute('font-size', boyut);
    t.setAttribute('text-anchor', 'middle');
    t.textContent = String.fromCodePoint(kod);
    svg.appendChild(t);
  }
  for (let i = 0; i < 5; i++) cizgi(0, 220, 50 + i * 10);
  glif(SOL_ANAHTARI, 22, 80, 40);

  const yerler = perde.parcalar.length === 2 ? [[78, 98], [124, 144]] : [[100, 120]];
  perde.parcalar.forEach(function (p, i) {
    const mutlak = p.oktav * 7 + HARF_SIRASI[p.harf];
    const y = ALT_CIZGI_Y - (mutlak - 30) * 5;
    const ax = yerler[i][0], nx = yerler[i][1];
    for (let yl = 40; yl >= y - 0.1; yl -= 10) cizgi(nx - 9, nx + 9, yl);
    for (let yl = 100; yl <= y + 0.1; yl += 10) cizgi(nx - 9, nx + 9, yl);
    if (p.isaret) glif(DEGISTIRGE[p.isaret + p.tur], ax, y, 40);
    glif(NOTA_BASI, nx, y, 40);
  });
  kutu.innerHTML = '';
  kutu.appendChild(svg);
}

  [['#a8742f', 26], ['#e8c27a', 18]].forEach(function (c) {

      t.style.left = (n.x + (n.x > w / 2 ? -110 : 40)) + 'px';
      t.style.top = (n.y - 14) + 'px';

// =====================================================
// 9) SORU ÜRETİMİ
// =====================================================
function imzaOf(p) {
  const a = p.parcalar[0];
  return a.harf + (a.isaret || '') + (a.tur || '');
}

function celdiriciSec(dogru, havuz, d) {
  const adaylar = havuz.filter(function (p) { return p.id !== dogru.id; })
    .sort(function (a, b) {
      return Math.abs(a.parcalar[0].koma - dogru.parcalar[0].koma) -
             Math.abs(b.parcalar[0].koma - dogru.parcalar[0].koma);
    });
  const secilen = [];
  if (d >= 0.6 && Math.random() < 0.5) {
    const ayni = adaylar.filter(function (p) { return imzaOf(p) === imzaOf(dogru); });
    if (ayni.length) secilen.push(ayni[Math.floor(Math.random() * ayni.length)]);
  }
  const w = Math.max(4, Math.round(adaylar.length * Math.pow(1 - d, 2)));
  karistir(adaylar.slice(0, w)).forEach(function (p) {
    if (secilen.length < 3 && secilen.indexOf(p) < 0) secilen.push(p);
  });
  adaylar.forEach(function (p) {
    if (secilen.length < 3 && secilen.indexOf(p) < 0) secilen.push(p);
  });
  return secilen;
}

function soruListesiYap(s) {
  const havuz = PERDELER.filter(function (p) { return s.gruplar.indexOf(p.grup) >= 0; });
  const yeniler = s.yeni === null ? [] : havuz.filter(function (p) { return p.grup === s.yeni; });
  const kullanilan = {}, liste = [];
  for (let q = 0; q < s.soru; q++) {
    let sec = null;
    for (let deneme = 0; deneme < 30; deneme++) {
      const kaynak = (yeniler.length && RAST() < s.yeniOran) ? yeniler : havuz;
      const aday = rastgele(kaynak);
      if (!kullanilan[aday.id]) { sec = aday; break; }
    }
    if (!sec) sec = rastgele(havuz);
    kullanilan[sec.id] = true;
    liste.push(sec);
  }
  return { liste: liste, havuz: havuz };
}

let OY = null;

function oyunKur(tur, s, i, liste, havuz, zor) {
  seriGuncelle();
  OY = { tur: tur, i: i, s: s, sorular: liste, havuz: havuz, k: 0, kalp: 3, hata: 0, dogru: 0,
         kilit: false, zaman: null, zor: zor, jokerSayi: 0, jokerKullandi: false, yeniKart: [], q: null };
  ekranAc('ekranOyun');
  soruGoster();
}
function oyunBaslat(i) {
  const s = SEVIYELER[i];
  const sl = soruListesiYap(s);
  oyunKur('seviye', s, i, sl.liste, sl.havuz, zorlukOf(s));
}

function kalpYaz() {
  $('kalpler').textContent = OY.tur === 'antrenman' ? '🎯 Antrenman' : '❤️'.repeat(OY.kalp) + '🖤'.repeat(3 - OY.kalp);
}

// ---- Zayıf puanı ve kartlar ----
function zayifArttir(id, n) { DURUM.zayif[id] = Math.min(6, (DURUM.zayif[id] || 0) + n); }
function zayifAzalt(id) {
  if (!DURUM.zayif[id]) return;
  DURUM.zayif[id]--;
  if (DURUM.zayif[id] <= 0) delete DURUM.zayif[id];
}

// ---- Jokerler ----
function jokerYaz() {
  const kap = $('jokerler');
  if (!OY || OY.tur !== 'seviye') { kap.style.display = 'none'; return; }
  kap.style.display = 'flex';
  kap.innerHTML = '';
  const c = document.createElement('div');
  c.className = 'cuzdan';
  c.innerHTML = '⭐ ' + cuzdan() + '<br><small>' + (JOKER_LIMIT - OY.jokerSayi) + ' hak</small>';
  kap.appendChild(c);
  JOKERLER.forEach(function (j) {
    const b = document.createElement('button');
    b.className = 'jk';
    b.innerHTML = j.ikon + ' ' + j.ad + '<br><small>⭐ ' + j.maliyet + '</small>';
    b.disabled = OY.kilit || OY.jokerSayi >= JOKER_LIMIT || cuzdan() < j.maliyet ||
                 (OY.q && OY.q.kullanilan[j.id]) || (j.id === 'kalp' && OY.kalp >= 3);
    b.onclick = function () { jokerKullan(j.id); };
    kap.appendChild(b);
  });
}

function jokerKullan(id) {
  if (!OY || OY.tur !== 'seviye' || OY.kilit) return;
  let j = null;
  JOKERLER.forEach(function (x) { if (x.id === id) j = x; });
  if (!j || OY.jokerSayi >= JOKER_LIMIT || cuzdan() < j.maliyet || OY.q.kullanilan[id]) return;
  if (id === 'kalp' && OY.kalp >= 3) return;

  DURUM.harcanan += j.maliyet;
  OY.jokerSayi++;
  OY.jokerKullandi = true;
  OY.q.kullanilan[id] = true;
  const dogru = OY.q.dogru;

  if (id === 'yarim') {
    OY.q.joker = true;
    karistir(OY.q.butonlar.filter(function (x) { return x.perde.id !== dogru.id; })).slice(0, 2).forEach(function (x) {
      x.btn.disabled = true; x.btn.classList.add('elendi');
    });
  } else if (id === 'ipucu') {
    OY.q.joker = true;
    $('ipucu').textContent = '💡 Yazımı: ' + notaMetni(dogru);
    $('ipucu').style.display = 'block';
  } else if (id === 'kalp') {
    OY.kalp++;
    kalpYaz();
  } else if (id === 'atla') {
    zayifArttir(dogru.id, 1);
    const kullanilan = OY.sorular.map(function (p) { return p.id; });
    let adaylar = OY.havuz.filter(function (p) { return kullanilan.indexOf(p.id) < 0; });
    if (!adaylar.length) adaylar = OY.havuz.filter(function (p) { return p.id !== dogru.id; });
    OY.sorular[OY.k] = rastgele(adaylar);
    kaydet();
    toast('⏭️ Soru atlandı · bu perde zayıf listene eklendi');
    soruGoster();
    return;
  }
  kaydet();
  jokerYaz();
  seritYaz();
}

// ---- Soru gösterimi ----
function soruGoster() {
  OY.kilit = false;
  const dogru = OY.sorular[OY.k];
  const s = OY.s;
  const yon = s.yon === 'karisik' ? (Math.random() < 0.5 ? 'adporte' : 'portead') : s.yon;
  OY.q = { dogru: dogru, yon: yon, joker: false, kullanilan: {}, butonlar: [] };

  const notaKutu = $('nota'), adKutu = $('soruad'), siklar = $('siklar');
  $('ilerlemeDolgu').style.width = (OY.k / OY.sorular.length * 100) + '%';
  kalpYaz();
  $('sonuc').textContent = '';
  $('sonuc').style.color = '';
  $('ipucu').style.display = 'none';
  $('ipucu').textContent = '';

  if (yon === 'adporte') {
    adKutu.textContent = dogru.ad;
    adKutu.style.display = ''; notaKutu.style.display = 'none';
    siklar.className = 'portler';
  } else {
    notaCiz(notaKutu, dogru);
    notaKutu.style.display = ''; adKutu.style.display = 'none';
    siklar.className = 'adlar';
  }

  const secenekler = karistir([dogru].concat(celdiriciSec(dogru, OY.havuz, OY.zor)));
  siklar.innerHTML = '';
  secenekler.forEach(function (p) {
    const b = document.createElement('button');
    b.className = 'sik';
    if (yon === 'adporte') notaCiz(b, p); else b.textContent = p.ad;
    b.onclick = function () {
      if (OY.kilit) return;
      OY.kilit = true;
      OY.q.butonlar.forEach(function (x) { x.btn.disabled = true; });
      const dogruMu = p.id === dogru.id;
      if (dogruMu) {
        OY.dogru++;
        b.classList.add('dogru');
        let m = '✅ Doğru!';
        if (!OY.q.joker) {
          zayifAzalt(dogru.id);
          if (!DURUM.kart[dogru.id]) { DURUM.kart[dogru.id] = 1; OY.yeniKart.push(dogru.ad); m += ' 🃏 Yeni kart!'; }
        }
        $('sonuc').textContent = m;
        $('sonuc').style.color = '#2c7a3f';
      } else {
        OY.hata++;
        if (OY.tur !== 'antrenman') OY.kalp--;
        zayifArttir(dogru.id, 2);
        b.classList.add('yanlis');
        OY.q.butonlar.forEach(function (x) { if (x.perde.id === dogru.id) x.btn.classList.add('dogru'); });
        $('sonuc').textContent = '❌ Doğrusu: ' + dogru.ad;
        $('sonuc').style.color = '#c53030';
        kalpYaz();
      }
      kaydet();
      jokerYaz();
      OY.zaman = setTimeout(function () {
        if (OY.tur !== 'antrenman' && OY.kalp <= 0) oyunBitir(false);
        else if (OY.k + 1 >= OY.sorular.length) oyunBitir(true);
        else { OY.k++; soruGoster(); }
      }, dogruMu ? 900 : 1700);
    };
    OY.q.butonlar.push({ btn: b, perde: p });
    siklar.appendChild(b);
  });
  jokerYaz();
}

// ---- Oyun sonu ----
function yildizDizi(n) {
  return '<div class="buyukyildiz" style="color:#f6b800">' + '★'.repeat(n) +
         '<span style="color:#ccc">' + '★'.repeat(3 - n) + '</span></div>';

function kartSatiri() {

function oyunBitir(basari) {
  const tur = OY.tur, i = OY.i;
  $('ilerlemeDolgu').style.width = '100%';
  const tekrarla = function () {
    modalKapat();
    if (tur === 'seviye') oyunBaslat(i); else if (tur === 'gunluk') gunlukBaslat(); else antrenmanBaslat();
  };

  // --- başarısızlık ---
  if (!basari) {
    kaydet();
    modalAc(
      '<h2>💔 Kalpler bitti</h2>' +
      '<p>' + OY.dogru + ' doğru cevap verdin. Bir daha dene!</p>' +
      kartSatiri() +
      '<p style="font-size:13px;color:#777">Yanlış yaptığın perdeler 🎯 Zayıf listene eklendi.</p>' +

      '<button class="dugme gri" id="harita2">Harita</button>'
    );

    $('harita2').onclick = haritayaDon;

  }

  // --- antrenman ---
  if (tur === 'antrenman') {
    const kalan = zayifListe().length;
    modalAc(
      '<h2>🎯 Antrenman bitti</h2>' +
      '<p>' + OY.dogru + ' / ' + OY.sorular.length + ' doğru</p>' + kartSatiri() +
      '<p>' + (kalan ? 'Hâlâ zayıf: ' + kalan + ' perde' : '🎉 Zayıf perden kalmadı!') + '</p>' +

    );
    if (kalan) $('tekrar').onclick = tekrarla;
    $('harita2').onclick = haritayaDon;
    return;
  }

  // --- günlük ---
  if (tur === 'gunluk') {
    const ilk = DURUM.gunluk.tarih !== bugun();
    const y = OY.hata === 0 ? 3 : (OY.hata === 1 ? 2 : 1);
    let odul = '<p style="color:#777">Bugünün ödülünü zaten aldın. Bu tur sadece pratikti.</p>';
    if (ilk) {
      DURUM.bonus += y;
      DURUM.gunluk.tarih = bugun();
      odul = '<p>⭐ cüzdana +' + y + '</p>';
    }
    kaydet();
    modalAc(
      '<h2>📅 Günlük görev tamam!</h2>' + yildizDizi(y) +
      '<p>' + OY.dogru + ' / ' + OY.sorular.length + ' doğru · ' + OY.hata + ' hata</p>' + odul + kartSatiri() +
      '<button class="dugme gri" id="harita2">Harita</button>'
    );
    $('harita2').onclick = haritayaDon;
    return;
  }

  // --- normal seviye ---
  const oncekiUnvan = unvanOf(bitenSayi()).ad;
  const eski = yildizOf(i);
  let yildiz = OY.hata === 0 ? 3 : (OY.hata === 1 ? 2 : 1);
  if (OY.jokerKullandi) yildiz = Math.min(yildiz, 2);
  DURUM.yildiz[i] = Math.max(eski, yildiz);
  kaydet();
  const fark = DURUM.yildiz[i] - eski;
  const yeniUnvan = unvanOf(bitenSayi()).ad;
  const sonrakiVar = i + 1 < SEVIYELER.length;
  const sonrakiAcik = sonrakiVar && acikMi(i + 1);

  let kapiNotu = '';
  if (sonrakiVar && !sonrakiAcik) {
    kapiNotu = '<p>🚪 Yeni bölüm için ⭐ ' + toplamYildiz() + ' / ' + kapiGereken(SEVIYELER[i + 1].bolum) +
               ' gerekli. Eski seviyeleri geliştir veya günlük görevi çöz.</p>';
  }

  modalAc(
    '<h2>🎉 Seviye ' + SEVIYELER[i].no + ' tamam!</h2>' + yildizDizi(yildiz) +
    (OY.jokerKullandi ? '<p style="font-size:13px;color:#a06a00">Joker kullandın: en fazla 2 ⭐</p>' : '') +
    '<p>' + OY.dogru + ' doğru · ' + OY.hata + ' hata</p>' +
    '<p>' + (fark > 0 ? '⭐ cüzdana +' + fark : 'Yıldız rekorunu geçmedin, cüzdan aynı kaldı') + '</p>' +
    (yeniUnvan !== oncekiUnvan ? '<p style="font-size:20px">🎖️ <b>Yeni ünvan: ' + yeniUnvan + '!</b></p>' : '') +
    kartSatiri() + kapiNotu +
    (sonrakiAcik ? '<button class="dugme" id="sonraki">Sonraki seviye</button>' : '') +
    (!sonrakiVar ? '<p><b>Tüm seviyeleri bitirdin! 🏆</b></p>' : '') +
    '<button class="dugme gri" id="tekrar">Tekrar oyna</button>' +
    '<button class="dugme gri" id="harita2">Harita</button>'
  );
  if (sonrakiAcik) $('sonraki').onclick = function () { modalKapat(); haritayaDon(); seviyeIntro(i + 1); };
  $('tekrar').onclick = tekrarla;
  $('harita2').onclick = haritayaDon;
}

function haritayaDon() {
  modalKapat();
  if (OY && OY.zaman) clearTimeout(OY.zaman);
  ekranAc('ekranHarita');
  haritaCiz(true);
}

$('cik').onclick = function () {
  modalAc(
    '<h2>Çıkmak istiyor musun?</h2><p>Bu turdaki ilerleme kaybolur. Harcadığın jokerler iade edilmez.</p>' +
    '<button class="dugme gri" id="devam">Devam et</button>' +
    '<button class="dugme" id="cikEvet" style="background:#e53e3e;box-shadow:0 4px 0 #a02020">Çık</button>'
  );
  $('devam').onclick = modalKapat;
  $('cikEvet').onclick = haritayaDon;
};

// =====================================================
// 11) KARTLAR, ZAYIF PERDELER, GÜNLÜK GÖREV
// =====================================================
function kartlarAc() {
  const sahip = PERDELER.filter(function (p) { return DURUM.kart[p.id]; }).length;
  let h = '<h2>🃏 Perde Kartları</h2><p>' + sahip + ' / ' + PERDELER.length +
          ' kart · Bir perdeyi jokersiz doğru bil, kartı aç.</p><div class="kartlar">';
  PERDELER.forEach(function (p) {
    h += DURUM.kart[p.id] ? '<div class="kart ac" data-id="' + p.id + '">' + p.ad + '</div>' : '<div class="kart">?</div>';
  });
  h += '</div><button class="dugme gri" id="kapat">Kapat</button>';
  modalAc(h, true);
  document.querySelectorAll('.kart.ac').forEach(function (el) {
    el.onclick = function () { kartDetay(el.getAttribute('data-id')); };
  });
  $('kapat').onclick = modalKapat;
}

function kartDetay(id) {
  let p = null;
  PERDELER.forEach(function (x) { if (x.id === id) p = x; });
  modalAc(
    '<h2>' + p.ad + '</h2><div id="kartNota"></div>' +
    '<p><b>Yazılışı:</b> ' + notaMetni(p) + '</p>' +
    '<p style="font-size:13px;color:#777">Grup: ' + GRUP_AD[p.grup] + '</p>' +
    '<button class="dugme gri" id="geri">Kartlara dön</button>'
  );
  notaCiz($('kartNota'), p);
  $('geri').onclick = kartlarAc;
}

function zayifListe() {
  return PERDELER.filter(function (p) { return DURUM.zayif[p.id] > 0; })
    .sort(function (a, b) { return DURUM.zayif[b.id] - DURUM.zayif[a.id]; });
}

function zayifAc() {
  const zl = zayifListe();
  let h = '<h2>🎯 Zayıf Perdeler</h2>';
  if (!zl.length) {
    h += '<p>Şu an zayıf perden yok. 🎉 Yanlış yaptığın veya atladığın perdeler burada birikir.</p>';
  } else {
    h += '<p>Yanlış yaptığın perdeler. Jokersiz doğru bildikçe listeden düşer.</p>';
    zl.slice(0, 12).forEach(function (p) {
      h += '<div class="zsatir"><span>' + p.ad + '</span><span>' + '🔴'.repeat(Math.ceil(DURUM.zayif[p.id] / 2)) + '</span></div>';
    });
    if (zl.length > 12) h += '<p style="font-size:13px;color:#777">… ve ' + (zl.length - 12) + ' perde daha</p>';
  }
  h += '<button class="dugme" id="antr"' + (zl.length ? '' : ' disabled') + '>Antrenman başlat</button>' +
       '<button class="dugme gri" id="kapat">Kapat</button>';
  modalAc(h, true);
  $('kapat').onclick = modalKapat;
  if (zl.length) $('antr').onclick = function () { modalKapat(); antrenmanBaslat(); };
}

function antrenmanBaslat() {
  const zl = zayifListe();
  if (!zl.length) return;
  const bolum = SEVIYELER[suAnki()].bolum, g = BOLUMLER[bolum].g;
  const havuz = PERDELER.filter(function (p) { return g.indexOf(p.grup) >= 0; });
  zl.forEach(function (p) { if (havuz.indexOf(p) < 0) havuz.push(p); });
  const liste = zl.slice(0, 8);
  const diger = karistir(havuz.filter(function (p) { return liste.indexOf(p) < 0; }));
  while (liste.length < 6 && diger.length) liste.push(diger.shift());
  const s = { no: 'Antrenman', gruplar: g, yeni: null, boss: false, yon: 'karisik', soru: liste.length, bolum: bolum };
  oyunKur('antrenman', s, -1, karistir(liste), havuz, 0.6);
}

function gunlukAc() {
  const yapildi = DURUM.gunluk.tarih === bugun();
  modalAc(
    '<h2>📅 Günlük Meydan Okuma</h2>' +
    '<p>10 soru · 3 kalp · joker yok</p>' +
    '<p>Ödül: 0 hata 3 ⭐, 1 hata 2 ⭐, diğer 1 ⭐.</p>' +
    (yapildi ? '<p><b>✅ Bugünün ödülünü aldın.</b> Yine çözebilirsin ama ödül vermez. Yarın yeni sorular gelir.</p>'
             : '<p>Ödül günde bir kez verilir. Kalpler biterse tekrar deneyebilirsin.</p>') +
    '<p style="font-size:13px;color:#777">Seri: 🔥 ' + seriGun() + ' gün · Her 7. gün +1 ⭐</p>' +
    '<button class="dugme" id="basla">' + (yapildi ? 'Pratik yap' : 'Başla') + '</button>' +
    '<button class="dugme gri" id="kapat">Kapat</button>'
  );
  $('basla').onclick = function () { modalKapat(); gunlukBaslat(); };
  $('kapat').onclick = modalKapat;
}

function gunlukBaslat() {
  const bolum = SEVIYELER[suAnki()].bolum, b = BOLUMLER[bolum];
  const s = { no: 'Günlük', gruplar: b.g, yeni: null, boss: false, yon: 'karisik', soru: 10, yeniOran: 0, bolum: bolum };
  RAST = tohumla(bugun() + '|' + bolum);
  const sl = soruListesiYap(s);
  RAST = Math.random;
  oyunKur('gunluk', s, -1, sl.liste, sl.havuz, Math.min(1, 0.25 + bolum * 0.12));
}

$('kartBtn').onclick = kartlarAc;
$('zayifBtn').onclick = zayifAc;
$('gunBtn').onclick = gunlukAc;

// =====================================================
$('ayar').onclick = function () {
  modalAc(
    '<h2>⚙️ Ayarlar</h2><p>İlerlemeyi sıfırlarsan yıldızlar, kartlar ve seri silinir.</p>' +
    '<button class="dugme gri" id="iptal">Vazgeç</button>' +
    '<button class="dugme" id="sifirla" style="background:#e53e3e;box-shadow:0 4px 0 #a02020">Sıfırla</button>'
  );
  $('iptal').onclick = modalKapat;

$('bilgi').onclick = function () {
  modalAc(
    '<h2>🎶 Perde Macerası</h2>' +
    '<p style="text-align:left">Türk müziği öğrencilerinin perde isimlerini portedeki karşılıklarıyla birlikte eğlenceli bir şekilde öğrenmesi için hazırlandı.</p>' +
    '<p style="text-align:left">Oyun ana perdelerle başlar. Seviyeler ilerledikçe Nim, Dik, Kaba ve Tiz ara perdeleri de katılır, soruların zorluğu artar.</p>' +
    '<p style="text-align:left"><b>Nasıl işler?</b> ⭐ yıldızlar seviyelerden ve günlük görevden gelir, jokerlere harcanır. 🎖️ ünvanlar biten seviye sayısına bağlıdır ve kaybolmaz.</p>' +
    '<p style="text-align:left">Uygulama vibe coding yöntemiyle, yapay zekâ desteğiyle geliştirildi ve yayınlandı.</p>' +
    '<p style="margin-top:14px"><b>Burak Baştaş</b><br>Ondokuz Mayıs Üniversitesi<br>Türk Sanat Müziği Bölümü</p>' +
    '<p style="font-size:12px;color:#888">İlerlemen yalnızca bu cihazın tarayıcısında saklanır.</p>' +
    '<button class="dugme" id="bilgiKapat">Tamam</button>'
  );

  if ($('ekranHarita').classList.contains('acik')) haritaCiz(false);
});

            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

const MOBIL = IOS || /android/i.test(navigator.userAgent);
if (!KURULU && MOBIL) $('kur').style.display = '';


window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();
  KUR_OLAY = e;
});
window.addEventListener('appinstalled', function () {
  $('kur').style.display = 'none';
  toast('🎉 Uygulama ana ekrana eklendi!', 3000);
});

$('kur').onclick = function () {
  if (KUR_OLAY) {
    KUR_OLAY.prompt();

      '<div class="adim">3️⃣ <b>Ana Ekrana Ekle</b> seçeneğini bul ve dokun.</div>' +
      '<div class="adim">4️⃣ Sağ üstteki <b>Ekle</b> düğmesine bas.</div>'
    : '<div class="adim">1️⃣ Tarayıcının sağ üstündeki <b>⋮</b> menüsünü aç.</div>' +
      '<div class="adim">2️⃣ <b>Uygulamayı yükle</b> veya <b>Ana ekrana ekle</b> seçeneğine dokun.</div>' +
      '<div class="adim">3️⃣ Çıkan pencerede onayla.</div>';
